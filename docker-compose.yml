services:
  app:
    image: inovatech/inova-api:latest
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_PORT=${API_PORT:-3000}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - inovatech.network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - "5632:5432"
    environment:
      POSTGRES_USER: inovatech
      POSTGRES_PASSWORD: inovatech
      POSTGRES_DB: inovaapi_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inovatech.network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  inovatech.network:
    driver: bridge